on: 
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main

jobs:
  check-changelog-updates:
    runs-on: ubuntu-latest
    # Explicitly grant permission to post comments
    permissions:
      pull-requests: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Check for changelog
        id: check-changelog
        run: |
          # Compare the PR head against the base branch
          echo "count=$(git diff --name-only origin/main...HEAD | grep -c '^CHANGELOG.md$')" >> $GITHUB_OUTPUT
      
      - name: Set comment body
        id: comment-body
        run: |
          if [ "${{ steps.check-changelog.outputs.count }}" -eq "0" ]; then
            echo "content=❗ **CHANGELOG.md** has not been updated." >> $GITHUB_OUTPUT
          else
            echo "content=👍 Updated **CHANGELOG.md** found." >> $GITHUB_OUTPUT
          fi
      
      - uses: actions/github-script@v7
        with:
          # Use GITHUB_TOKEN instead of a custom secret for security and fork support
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '${{ steps.comment-body.outputs.content }}'
            })
